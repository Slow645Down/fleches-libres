<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0f1226">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flèches Libres – Jeu de réflexion</title>
<style>
:root{--bg:#0f1226;--panel:#1a1f3d;--text:#f4f6ff;--accent:#4cc9f0;--bad:#ff5c7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;position:relative}
#bar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px}
#bar .lvl{font-weight:800;font-size:18px}
#hearts{font-size:18px;letter-spacing:2px}
.btns{display:flex;gap:6px}
.btn{background:var(--panel);color:var(--text);border:0;border-radius:12px;padding:9px 12px;font-size:16px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);color:#06202b}
.btn.block{display:block;width:100%;margin-top:10px;padding:13px}
#tip{text-align:center;font-size:13px;opacity:.75;padding:0 16px 4px;min-height:20px}
#stage{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%}
#adBottom{min-height:56px;display:flex;align-items:center;justify-content:center;background:#0b0d1d;font-size:11px;opacity:.9}
#overlay,#adOverlay{position:absolute;inset:0;background:rgba(5,7,20,.82);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.card{background:var(--panel);border-radius:20px;padding:24px;width:100%;max-width:340px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.card h2{margin:0 0 8px;font-size:24px}
.card p{margin:6px 0;opacity:.85}
.stars{font-size:34px;letter-spacing:6px;margin:6px 0}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="lvl">Niveau <span id="lvl">1</span></div>
    <div id="hearts"></div>
    <div class="btns">
      <button class="btn" id="bHint" title="Indice">💡</button>
      <button class="btn" id="bRestart" title="Recommencer">↻</button>
      <button class="btn" id="bSound" title="Son">🔊</button>
    </div>
  </div>
  <div id="tip"></div>
  <div id="stage"><canvas id="cv"></canvas></div>

  <!-- ====== EMPLACEMENT BANNIÈRE PUBLICITAIRE ======
       Collez ici le code de votre régie (Google AdSense, etc.) -->
  <div id="adBottom">Espace publicitaire (bannière)</div>

  <div id="overlay"><div class="card" id="card"></div></div>
  <div id="adOverlay"><div class="card"><h2>Publicité</h2><p>Simulation – remplacez par votre régie.</p><h2 id="adCount">3</h2></div></div>
</div>

<script>
/* =====================================================================
   CONFIGURATION & PUBLICITÉS
   Remplacez le contenu des fonctions Ads.* par le SDK de votre régie
   (GameDistribution, AdinPlay, CrazyGames, AdSense for Games, etc.).
   ===================================================================== */
const CONFIG = { INTERSTITIEL_TOUS_LES_N_NIVEAUX: 3, INDICES_GRATUITS_PAR_NIVEAU: 1, VIES: 3 };

const Ads = {
  // Pub plein écran entre deux niveaux. cb() est appelé quand elle est finie.
  interstitiel(cb){ this._simuler(cb); },
  // Pub avec récompense (continuer, indice). onReward() n'est appelé que si la pub est vue en entier.
  recompense(onReward){ this._simuler(onReward); },
  _simuler(cb){
    const ov=document.getElementById('adOverlay'), c=document.getElementById('adCount');
    let n=3; c.textContent=n; ov.style.display='flex';
    const t=setInterval(()=>{ n--; c.textContent=n; if(n<=0){ clearInterval(t); ov.style.display='none'; cb&&cb(); } },1000);
  }
};

/* ======================= JEU ======================= */
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]]; // haut, droite, bas, gauche
const COLORS=['#4cc9f0','#f72585','#ffd166','#06d6a0','#b388ff','#ff9f1c','#80ed99','#ff6b6b'];
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');

let level=1, g=5, arrows=[], occ=[], lives=3, hintsLeft=1, moving=0, over=false;
let W=0,H=0,cs=40,ox=0,oy=0,time=0,soundOn=true,levelsPlayed=0;

try{ level=parseInt(localStorage.getItem('fl_level'))||1; soundOn=localStorage.getItem('fl_sound')!=='0'; }catch(e){}

function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const inb=(x,y)=>x>=0&&y>=0&&x<g&&y<g;

/* Génération garantissant que le niveau est toujours solvable :
   chaque flèche posée a sa ligne de sortie libre de toute flèche posée avant elle. */
function generate(lv){
  const R=rng(lv*7919+13);
  const ri=n=>Math.floor(R()*n);
  g=Math.min(5+Math.floor((lv-1)/2),11);
  const maxL=Math.min(2+Math.floor(lv/3),7);
  occ=Array.from({length:g},()=>Array(g).fill(-1));
  arrows=[];
  const target=Math.floor(g*g*0.8);
  let filled=0,fails=0;
  while(filled<target&&fails<600){
    const L=2+ri(Math.max(1,maxL-1));
    const hx=ri(g),hy=ri(g),d=ri(4);
    if(occ[hy][hx]!==-1){fails++;continue}
    let ok=true,x=hx+DIRS[d][0],y=hy+DIRS[d][1];
    const line=new Set();
    while(inb(x,y)){ if(occ[y][x]!==-1){ok=false;break} line.add(y*g+x); x+=DIRS[d][0]; y+=DIRS[d][1]; }
    if(!ok){fails++;continue}
    const cells=[[hx,hy]], used=new Set([hy*g+hx]);
    let cx=hx,cy=hy;
    for(let i=1;i<L;i++){
      let cand;
      if(i===1) cand=[[hx-DIRS[d][0],hy-DIRS[d][1]]];
      else{ cand=DIRS.map(v=>[cx+v[0],cy+v[1]]); for(let k=cand.length-1;k>0;k--){const j=ri(k+1);[cand[k],cand[j]]=[cand[j],cand[k]]} }
      let placed=false;
      for(const [nx,ny] of cand){
        if(inb(nx,ny)&&occ[ny][nx]===-1&&!used.has(ny*g+nx)&&!line.has(ny*g+nx)){
          cells.push([nx,ny]);used.add(ny*g+nx);cx=nx;cy=ny;placed=true;break;
        }
      }
      if(!placed)break;
    }
    if(cells.length<2){fails++;continue}
    const id=arrows.length;
    cells.forEach(([x,y])=>occ[y][x]=id);
    arrows.push({id,dir:d,cells:cells.slice().reverse(),state:'idle',shake:0,hint:0,s:0,P:null});
    filled+=cells.length;
  }
}

function startLevel(lv){
  level=lv; $('lvl').textContent=lv;
  try{localStorage.setItem('fl_level',lv)}catch(e){}
  generate(lv);
  lives=CONFIG.VIES; hintsLeft=CONFIG.INDICES_GRATUITS_PAR_NIVEAU; moving=0; over=false;
  $('tip').textContent = lv<=2 ? 'Touchez une flèche pour la faire sortir. Si elle est bloquée, vous perdez une vie.' : '';
  updateHearts(); hideOverlay(); resize();
}

function updateHearts(){ $('hearts').textContent='❤️'.repeat(lives)+'🖤'.repeat(Math.max(0,CONFIG.VIES-lives)); }

/* Retourne null si la voie est libre, sinon l'id de la flèche qui bloque */
function blocker(a){
  const h=a.cells[a.cells.length-1],d=DIRS[a.dir];
  let x=h[0]+d[0],y=h[1]+d[1];
  while(inb(x,y)){ if(occ[y][x]!==-1&&occ[y][x]!==a.id) return occ[y][x]; x+=d[0]; y+=d[1]; }
  return null;
}

function tapArrow(a){
  if(over||a.state!=='idle')return;
  if(blocker(a)!==null){
    a.shake=0.35; lives--; updateHearts(); beep(140,.18,'sawtooth'); vib(60);
    if(lives<=0){ over=true; setTimeout(showGameOver,450); }
    return;
  }
  // libère la grille et lance l'animation de sortie
  a.cells.forEach(([x,y])=>occ[y][x]=-1);
  const L=a.cells.length,h=a.cells[L-1],d=DIRS[a.dir];
  let n=0,x=h[0]+d[0],y=h[1]+d[1];
  while(inb(x,y)){n++;x+=d[0];y+=d[1]}
  const P=a.cells.slice();
  for(let i=1;i<=n+L;i++)P.push([h[0]+d[0]*i,h[1]+d[1]*i]);
  a.P=P; a.s=0; a.sEnd=n+L; a.state='moving'; moving++;
  beep(520+Math.random()*200,.09,'triangle'); vib(15);
}

function finishArrow(a){
  a.state='gone'; moving--;
  if(arrows.every(r=>r.state==='gone')) setTimeout(showWin,250);
}

/* ---- Dessin ---- */
function samp(P,t){const i=Math.floor(t),f=t-i;if(i>=P.length-1)return P[P.length-1];return[P[i][0]+(P[i+1][0]-P[i][0])*f,P[i][1]+(P[i+1][1]-P[i][1])*f]}
function movingPts(a){
  const L=a.cells.length,P=a.P,s=a.s,pts=[samp(P,s)];
  for(let i=Math.ceil(s);i<=Math.floor(s+L-1);i++)pts.push(P[i]);
  pts.push(samp(P,s+L-1));
  return pts;
}
function drawArrow(a){
  const pts=a.state==='moving'?movingPts(a):a.cells;
  const d=DIRS[a.dir];
  let sx=0,sy=0;
  if(a.shake>0){const p=a.shake/0.35,off=Math.sin(p*25)*cs*.07*p;sx=-d[1]*off;sy=d[0]*off}
  const col=a.shake>0?'#ff5c7a':COLORS[a.id%COLORS.length];
  ctx.save(); ctx.translate(sx,sy);
  if(a.hint>0){ctx.shadowColor='#fff';ctx.shadowBlur=cs*(.3+.4*Math.abs(Math.sin(time*8)))}
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=cs*.2;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();
  pts.forEach(([x,y],i)=>{const px=ox+(x+.5)*cs,py=oy+(y+.5)*cs;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});
  ctx.stroke();
  const h=pts[pts.length-1],hx=ox+(h[0]+.5)*cs,hy=oy+(h[1]+.5)*cs,half=cs*.24;
  ctx.beginPath();
  ctx.moveTo(hx+d[0]*cs*.44,hy+d[1]*cs*.44);
  ctx.lineTo(hx+d[0]*cs*.02-d[1]*half,hy+d[1]*cs*.02+d[0]*half);
  ctx.lineTo(hx+d[0]*cs*.02+d[1]*half,hy+d[1]*cs*.02-d[0]*half);
  ctx.closePath();ctx.fill();
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.12)';
  for(let y=0;y<g;y++)for(let x=0;x<g;x++){ctx.beginPath();ctx.arc(ox+(x+.5)*cs,oy+(y+.5)*cs,cs*.05,0,7);ctx.fill()}
  for(const a of arrows)if(a.state!=='gone')drawArrow(a);
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  for(const a of arrows){
    if(a.shake>0)a.shake=Math.max(0,a.shake-dt);
    if(a.hint>0)a.hint=Math.max(0,a.hint-dt);
    if(a.state==='moving'){a.s+=dt*16;if(a.s>=a.sEnd)finishArrow(a)}
  }
  draw();requestAnimationFrame(loop);
}

function resize(){
  const r=$('stage').getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  cs=Math.min(W,H)/(g+.6);ox=(W-g*cs)/2;oy=(H-g*cs)/2;
}
addEventListener('resize',resize);

cv.addEventListener('pointerdown',e=>{
  initAudio();
  const r=cv.getBoundingClientRect();
  const gx=Math.floor((e.clientX-r.left-ox)/cs),gy=Math.floor((e.clientY-r.top-oy)/cs);
  if(!inb(gx,gy))return;
  const id=occ[gy][gx];
  if(id>=0)tapArrow(arrows[id]);
});

/* ---- Son & vibration ---- */
let ac=null;
function initAudio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function beep(f,d,type){
  if(!soundOn||!ac)return;
  const o=ac.createOscillator(),gn=ac.createGain();
  o.type=type;o.frequency.value=f;gn.gain.value=.08;
  gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
  o.connect(gn);gn.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
}
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ---- Écrans ---- */
function showOverlay(html){$('card').innerHTML=html;$('overlay').style.display='flex'}
function hideOverlay(){$('overlay').style.display='none'}

function showWin(){
  const stars=Math.max(1,lives);
  levelsPlayed++;
  showOverlay(`<h2>Niveau ${level} réussi !</h2>
    <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <button class="btn primary block" id="bNext">Niveau suivant ▶</button>`);
  $('bNext').onclick=()=>{
    const next=()=>startLevel(level+1);
    if(levelsPlayed%CONFIG.INTERSTITIEL_TOUS_LES_N_NIVEAUX===0)Ads.interstitiel(next);else next();
  };
}
function showGameOver(){
  showOverlay(`<h2>Plus de vies 💔</h2><p>Continuez le niveau ou recommencez.</p>
    <button class="btn primary block" id="bRev">▶ Pub : récupérer 1 vie</button>
    <button class="btn block" id="bRetry">Recommencer le niveau</button>`);
  $('bRev').onclick=()=>Ads.recompense(()=>{lives=1;over=false;updateHearts();hideOverlay()});
  $('bRetry').onclick=()=>startLevel(level);
}

/* ---- Boutons ---- */
function giveHint(){
  const free=arrows.filter(a=>a.state==='idle'&&blocker(a)===null);
  if(free.length)free[Math.floor(Math.random()*free.length)].hint=2.2;
}
$('bHint').onclick=()=>{
  if(over)return;
  if(hintsLeft>0){hintsLeft--;giveHint()}
  else Ads.recompense(giveHint);
};
$('bRestart').onclick=()=>startLevel(level);
$('bSound').onclick=()=>{soundOn=!soundOn;$('bSound').textContent=soundOn?'🔊':'🔇';try{localStorage.setItem('fl_sound',soundOn?'1':'0')}catch(e){}};
$('bSound').textContent=soundOn?'🔊':'🔇';

startLevel(level);
requestAnimationFrame(loop);
</script>
</body>
</html>
